# Netlify config for the hosted (public, guest-facing) build.
#
# Both backends are reached DIRECTLY at the home machine via the Tailscale
# Funnel (browser → funnel → home nginx → Modal / vLLM adapter). This bypasses
# Netlify's 26s proxy timeout, which real OCR (30-60s) exceeds. nginx allows
# 300s and adds the adapter token server-side, so no secret ships in the bundle.
#
# The funnel hostname is public (not a secret), so it lives here. Requires the
# funnel to expose the nginx container: `tailscale funnel --bg 8181`. When the
# PC is off the site can't reach either backend (accepted trade-off).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://apt-server-desktop.tail806605.ts.net/api"
  VITE_VLLM_URL = "https://apt-server-desktop.tail806605.ts.net/api-vllm"

# SPA fallback — serve index.html for any unknown path. (No /api proxy here
# anymore; the SPA calls the funnel directly at the absolute URLs above.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
