# Netlify config for the hosted (public, guest-facing) build.
#
# Backends on the hosted site:
#   - Default (Khmer Parsing API): same-origin redirect below (the Modal
#     upstream sends no CORS headers, so it must be proxied).
#   - vLLM (your home GPU): the SPA calls /api-vllm/* which is handled by the
#     serverless function netlify/functions/vllm.mjs. That function forwards to
#     your Tailscale Funnel using two SERVER-SIDE secrets — never in the bundle:
#         VLLM_FUNNEL_URL  e.g. https://apt-server-desktop.tail806605.ts.net
#         ADAPTER_TOKEN    the shared secret the adapter checks
#     Set BOTH in the Netlify dashboard → Site settings → Environment variables
#     (do NOT commit them here). If unset, the vLLM badge just shows offline.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Default backend — same-origin proxy to the Khmer Parsing API.
[[redirects]]
  from = "/api/*"
  to = "https://rinabuoy13--khparser-api.modal.run/:splat"
  status = 200

# SPA fallback — serve index.html for any unknown path. (The vLLM function
# claims /api-vllm/* via its own config.path, so it is matched before this.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
