# Netlify config for the hosted (public, guest-facing) build.
#
# --- Why the API calls are SAME-ORIGIN ---------------------------------------
# The SPA calls relative paths (/api, /api-vllm, /api-lens, /api-tidy) and
# Netlify proxies them to the home machine over the Tailscale Funnel.
#
# It used to call the funnel hostname DIRECTLY (absolute https://...ts.net/...
# URLs baked in via VITE_*_URL). That broke on any device signed into the
# tailnet: MagicDNS resolves the funnel hostname to a PRIVATE 100.x.x.x address,
# so Chrome treats a public site reaching a private IP as "Local Network Access"
# and blocks every backend call behind a permission prompt
# ("romdoulocr.netlify.app is asking you to access other devices on your local
# network"). Until the user clicks Allow, all backends read "offline" -- which is
# indistinguishable from a real outage. Proxying through Netlify means the
# browser only ever talks to the public netlify.app origin, so that prompt can
# never appear, on any device, with no per-device setup.
#
# TRADE-OFF: Netlify caps a proxied request at ~26s. That was fatal when OCR took
# 30-60s, but is workable now: /health is cached at nginx (~10ms), the watchdog
# keeps the Modal OCR container warm (~2s), and the app already sends ONE PAGE
# PER REQUEST. A cold Modal (~22s) is the tight case to watch.
#
# TO REVERT to direct-funnel calls (e.g. if 26s bites): re-add the VITE_*_URL
# vars below to [build.environment] and delete the four proxy redirects. The
# funnel itself stays configured either way, so this is a one-line rollback.
#
# Requires the funnel to expose the nginx container: `tailscale funnel --bg 8181`.
# When the PC is off the site can't reach any backend (accepted trade-off).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Same-origin metadata API: every parse on the PUBLIC site also saves an
  # extraction record to the home metadata service (proxied below, fire-and-
  # forget with a 2s cap — an unreachable home PC never affects parsing).
  VITE_METADATA_URL = "/api-meta"
  # No VITE_*_URL here on purpose -- unset makes the SPA fall back to the
  # relative paths (/api, /api-vllm, /api-lens, /api-tidy) proxied below.
  # See src/lib/backend.ts and src/lib/tidy.ts for those defaults.

# --- API proxies (MUST come before the SPA fallback) -------------------------
# status = 200 makes these rewrites (proxy) rather than redirects, so the
# browser never learns the upstream URL. force = true so they win over the
# catch-all below.

# The SPA's default engine goes STRAIGHT to Modal, not through the home PC.
# This is the only engine that can survive the desktop being asleep, rebooting,
# or offline — and it was previously routed through the funnel purely by habit,
# which meant a sleeping PC took down the cloud engine too.
#
# Modal sends no CORS headers at all and 405s an OPTIONS preflight, but that is
# irrelevant here: a Netlify `status = 200` rule is a SERVER-SIDE rewrite, so the
# browser only ever talks to romdoulocr.netlify.app.
#
# What this trades away, honestly: nginx's cached /health (the badge resolves in
# ~0.9s warm / ~10s cold instead of ~10ms), the courtesy rate limit, and
# Idempotency-Key replay. Verified that the SPA uses none of them — it reads only
# `detail` on errors. The ~26s Netlify ceiling is NOT a new cost: it already
# applied on the funnel path, and going direct removes two hops.
#
# Integrators are unaffected — /v1/api/* below still goes through nginx, where the
# rate limits, structured errors and idempotency guarantees live.
[[redirects]]
  from = "/api/*"
  to = "https://rinabuoy13--khparser-api.modal.run/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-vllm/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-vllm/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-lens/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-lens/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-tidy/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-tidy/:splat"
  status = 200
  force = true

# Metadata service: full public API (records CRUD, export, stats, meta, docs).
# Public callers use https://romdoulocr.netlify.app/api-meta/api/v1/records — no
# CORS issues since Netlify rewrites server-side to the home funnel.
[[redirects]]
  from = "/api-meta/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-meta/:splat"
  status = 200
  force = true

# Metadata portal — same origin as the OCR app. Login-gated on the data side.
[[redirects]]
  from = "/portal"
  to = "https://apt-server-desktop.tail806605.ts.net/portal/"
  status = 200
  force = true

[[redirects]]
  from = "/portal/*"
  to = "https://apt-server-desktop.tail806605.ts.net/portal/:splat"
  status = 200
  force = true

# Versioned public entry point for third-party integrators (/v1/api/...).
#
# Written out per engine, mapping straight to the UNVERSIONED upstream path,
# because this is the exact rule shape already proven to carry multipart POST
# uploads (see the /api/* rules above). A single catch-all `/v1/* -> /v1/:splat`
# may well work too — it has not been tested, because the deploy that would have
# tested it never reached Netlify. Prefer the known-good shape.
#
# NOTE for testing: `GET /v1/anything` returns 200 even when these rules are
# absent — the SPA fallback at the bottom serves index.html for any GET. Always
# assert on the response BODY, not the status code, when checking these routes.
#
# nginx ALSO understands /v1 natively (it rewrites internally), so callers hitting
# the funnel host directly can use /v1 too; these rules only fix the Netlify hop.
[[redirects]]
  from = "/v1/api/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/api-vllm/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-vllm/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/api-lens/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-lens/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/api-tidy/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-tidy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/api-meta/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-meta/:splat"
  status = 200
  force = true

# Async batch jobs (submit -> poll -> fetch result).
[[redirects]]
  from = "/v1/api-jobs/*"
  to = "https://apt-server-desktop.tail806605.ts.net/api-jobs/:splat"
  status = 200
  force = true

# Aggregate engine status. Without this the SPA fallback answers GET /v1/status
# with index.html and a 200 — assert on the BODY when testing this route.
[[redirects]]
  from = "/v1/status"
  to = "https://apt-server-desktop.tail806605.ts.net/api-status/status"
  status = 200
  force = true

# SPA fallback -- serve index.html for any unknown path. Keep this LAST.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
