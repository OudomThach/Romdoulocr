# Netlify config for the hosted (public, guest-facing) build.
#
# Differences vs the Docker/nginx deployment:
#   - The /api reverse proxy is recreated with a Netlify redirect (the Modal
#     upstream sends no CORS headers, so same-origin proxying is required).
#   - The vLLM backend is reached DIRECTLY at a public Tailscale Funnel URL
#     (VITE_VLLM_URL) instead of the nginx /api-vllm proxy: the adapter sends
#     CORS headers, and a direct call avoids Netlify's ~26s proxy timeout,
#     which long OCR inference would exceed. Requires the funnel to be up on
#     the GPU machine: `tailscale funnel --bg 8090`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_VLLM_URL = "https://apt-server-desktop.tail806605.ts.net"

# Same-origin proxy to the Khmer Parsing API (replaces nginx's /api location).
[[redirects]]
  from = "/api/*"
  to = "https://rinabuoy13--khparser-api.modal.run/:splat"
  status = 200

# SPA fallback — serve index.html for any unknown path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
