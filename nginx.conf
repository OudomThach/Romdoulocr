# Minimal nginx config for serving a single-page app AND same-origin
# reverse-proxying of /api/* to the configured upstream API.
#
# - Serves hashed assets under /assets/ with a long cache lifetime.
# - Never caches index.html so deploys are picked up immediately.
# - Falls back to /index.html for unknown paths so client-side routing works
#   even if URL-based routing is added later.
# - Proxies /api/* to ${API_UPSTREAM}, stripping the /api/ prefix. This is
#   what fixes the CORS issue: the browser sees a same-origin call and skips
#   the preflight, while nginx handles the actual cross-origin hop upstream.

# --- DNS resolver ---------------------------------------------------------
# Modal's API resolves to multiple IPs (AWS load balancer); if we don't
# have a resolver directive nginx caches whatever it got at startup and
# returns 502 once any of those IPs become unreachable. With a resolver
# in the http{} context, nginx re-resolves the upstream hostname on every
# proxy_pass that uses a variable form.
resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
resolver_timeout 5s;

# --- MIME types ------------------------------------------------------------
# The default nginx mime.types ships with .js and .json mapped, but NOT
# .mjs. pdfjs-dist 4.x ships its worker as pdf.worker.min.mjs, and if
# nginx returns application/octet-stream for it, the browser refuses to
# dynamic-import the file as an ES module (silently fails with
# "Failed to fetch dynamically imported module"). Pinning both .mjs
# and the various JS module extensions to application/javascript.
types {
    application/javascript  mjs;
    text/javascript         mjs;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow multipart uploads of PDFs / images up to 100MB. nginx's default of
    # 1MB silently rejects anything larger with 413, which manifests as a
    # confusing "Network error" in the browser.
    client_max_body_size 100M;

    # gzip text payloads (assets are already minified but HTML/JSON benefit).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Same-origin reverse proxy ------------------------------------------
    location /api/ {
        # CORS: the PUBLIC Netlify SPA calls this proxy cross-origin (via the
        # Tailscale Funnel) because Netlify's own proxy caps requests at 26s and
        # real OCR takes longer. nginx has no such cap. Modal is already public,
        # so proxying to it openly adds no new exposure.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        # Rewrite /api/<path> to /<path> for the upstream.
        rewrite ^/api/(.*)$ /$1 break;

        # Use the resolver-driven variable form so DNS re-resolution works.
        # (Plain `proxy_pass https://host;` skips the resolver for that host.)
        proxy_pass ${API_UPSTREAM};

        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # If an upstream connection dies mid-request, try the next IP in
        # the pool instead of failing the user.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 60s;
    }

    # --- Local vLLM backend (optional, toggled in the UI) ------------------
    # When the user flips the in-app backend toggle to "vLLM", the SPA calls
    # /api-vllm/* instead of /api/*. We strip the prefix and proxy to the
    # vllm-adapter sidecar BY CONTAINER NAME over the shared Docker network
    # (this container joins surya-container-vllm_default — see docker-compose).
    #
    # Why the container name and not host.docker.internal:8090? The host-port
    # hop relies on Docker Desktop's WSL2 port forwarding, which goes stale
    # (PC sleep, WSL restart, idle) — leaving the adapter "healthy but
    # unreachable" and the UI showing "vLLM offline". Container-to-container
    # over Docker's embedded DNS (127.0.0.11, in the resolver list above) has
    # no such relay, so it stays reachable. The default /api path is unaffected.
    location /api-vllm/ {
        # Resolve the adapter's container name with DOCKER'S DNS ONLY. The global
        # resolver above also lists public DNS (1.1.1.1/8.8.8.8) for the external
        # Modal host; if nginx asked those for the internal name `vllm-adapter`
        # it returns "Host not found" → intermittent 502 every time the 30s DNS
        # cache expires. A location-scoped resolver pinned to 127.0.0.11 (Docker
        # embedded DNS) fixes that while still re-resolving (handles IP changes).
        resolver 127.0.0.11 valid=30s ipv6=off;

        # CORS for the public SPA (same rationale as /api/ above). The adapter
        # token is added server-side below, so the browser never sees it.
        # The adapter (FastAPI) ALSO sends Access-Control-Allow-Origin, so we
        # must HIDE the upstream's copy — two ACAO headers make browsers reject
        # the response as a CORS error ("Surya offline" even though it's up).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        # NOTE: `set` must come BEFORE the `rewrite ... break;` — the break flag
        # ends the rewrite phase, and `set` is a rewrite-phase directive, so a
        # `set` placed after it never runs (leaving $vllm_adapter empty -> 500).
        set $vllm_adapter http://vllm-adapter:8090;
        rewrite ^/api-vllm/(.*)$ /$1 break;

        proxy_pass $vllm_adapter;

        proxy_http_version 1.1;

        # Shared secret so the SAME adapter can be safely exposed to the public
        # internet via a Tailscale Funnel (the adapter 401s without it). Injected
        # at image build from the gitignored .env — empty when unset (home-only
        # deployments where the adapter also has no token), which the adapter
        # accepts. Keep the two in sync (both read ADAPTER_TOKEN from .env).
        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_buffering off;

        # Model inference is slow; allow long-running requests.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Google Lens backend (optional, toggled in the UI) -----------------
    # When the header backend toggle is set to "Google Lens", the SPA calls
    # /api-lens/* → the lens-adapter sidecar (chrome-lens-py). Same pattern as
    # /api-vllm/ above: Docker-DNS resolver, CORS (with upstream ACAO stripped),
    # and the shared token injected server-side.
    location /api-lens/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        set $lens_adapter http://lens-adapter:8091;
        rewrite ^/api-lens/(.*)$ /$1 break;

        proxy_pass $lens_adapter;
        proxy_http_version 1.1;

        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_buffering off;

        # Lens round-trips to Google can be slow; allow long requests.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Hashed Vite assets — cache aggressively ---------------------------
    # Note: we deliberately don't include `immutable` here. The URLs are
    # content-hashed so the URL itself changes when the file changes; without
    # immutable, browsers will re-validate via ETag on subsequent visits,
    # which is the safety net we need if the upstream response (e.g.
    # Content-Type) ever changes between deploys.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, must-revalidate";
        try_files $uri =404;
    }

    # --- Static files at the root (favicon, etc.) --------------------------
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --- Default: SPA fallback to index.html -------------------------------
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # --- Defense in depth: don't serve dotfiles (.env, .git, etc.) ---------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
