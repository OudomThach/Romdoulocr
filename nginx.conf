# Minimal nginx config for serving a single-page app AND same-origin
# reverse-proxying of /api/* to the configured upstream API.
#
# - Serves hashed assets under /assets/ with a long cache lifetime.
# - Never caches index.html so deploys are picked up immediately.
# - Falls back to /index.html for unknown paths so client-side routing works
#   even if URL-based routing is added later.
# - Proxies /api/* to ${API_UPSTREAM}, stripping the /api/ prefix. This is
#   what fixes the CORS issue: the browser sees a same-origin call and skips
#   the preflight, while nginx handles the actual cross-origin hop upstream.

# --- DNS resolver ---------------------------------------------------------
# Modal's API resolves to multiple IPs (AWS load balancer); if we don't
# have a resolver directive nginx caches whatever it got at startup and
# returns 502 once any of those IPs become unreachable. With a resolver
# in the http{} context, nginx re-resolves the upstream hostname on every
# proxy_pass that uses a variable form.
resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
resolver_timeout 5s;

# --- Real client IP --------------------------------------------------------
# Requests arrive via Netlify's proxy and/or the Tailscale Funnel, so
# $remote_addr is the PROXY, not the caller. Without this every visitor shares
# one rate-limit bucket and a single batch job would throttle the whole app.
# NOTE: we trust X-Forwarded-For from any source, so a determined caller can
# spoof it to dodge the limit. That's an accepted trade-off — these limits exist
# to protect one GPU from accidental hammering, not as a security control.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Rate limits -----------------------------------------------------------
# The API is intentionally open — anyone with the URL may call it — but not
# unlimited: there is exactly one GPU behind all of this.
#   api    2 req/sec sustained per client, bursting to 40. Comfortable for an
#          interactive user and for a batch client sending one page per request.
#   health 10 req/sec — the SPA polls these and they're cheap/cached.
limit_req_zone $binary_remote_addr zone=api_rl:10m    rate=120r/m;
limit_req_zone $binary_remote_addr zone=health_rl:10m rate=600r/m;
limit_req_status 429;

# --- Idempotency-Key replay ------------------------------------------------
# A client may send `Idempotency-Key: <unique-id>` on any POST. The response is
# cached against that key for 24h, so a retry after a dropped connection returns
# the ORIGINAL result instead of re-running OCR and re-spending GPU time.
# Caching engages ONLY when the header is present (see $idem_skip below).
proxy_cache_path /var/cache/nginx/idem levels=1:2 keys_zone=idemcache:10m
                 max_size=512m inactive=24h use_temp_path=off;
map $http_idempotency_key $idem_skip {
    ""      1;   # no key supplied -> never cache, always hit the engine
    default 0;
}

# --- Health-response cache -------------------------------------------------
# The upstream Modal API scales to zero, so a COLD /health can take 16-22s.
# The SPA polls /health to paint the backend badge, so that delay showed as
# "Checking backend..." (and, before the client timeout was raised, a false
# "offline") even though the stack was perfectly healthy.
#
# Caching /health for a short window makes the badge resolve INSTANTLY from
# nginx, and `proxy_cache_use_stale` keeps the last known-good answer flowing
# while the upstream is waking or briefly flaky, instead of failing the badge.
proxy_cache_path /var/cache/nginx/health levels=1:2 keys_zone=healthcache:1m
                 max_size=10m inactive=10m use_temp_path=off;

# --- MIME types ------------------------------------------------------------
# The default nginx mime.types ships with .js and .json mapped, but NOT
# .mjs. pdfjs-dist 4.x ships its worker as pdf.worker.min.mjs, and if
# nginx returns application/octet-stream for it, the browser refuses to
# dynamic-import the file as an ES module (silently fails with
# "Failed to fetch dynamically imported module"). Pinning both .mjs
# and the various JS module extensions to application/javascript.
types {
    application/javascript  mjs;
    text/javascript         mjs;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow multipart uploads of PDFs / images up to 100MB. nginx's default of
    # 1MB silently rejects anything larger with 413, which manifests as a
    # confusing "Network error" in the browser.
    client_max_body_size 100M;

    # --- API versioning ------------------------------------------------------
    # /v1/api/... is the PUBLIC, stable entry point for third-party integrators.
    # It rewrites internally to the unversioned path and re-runs location
    # matching (`last`), so every rule below applies identically to both. The
    # unversioned paths stay live because the SPA is built against them.
    # A future breaking change becomes /v2/... and leaves /v1 callers untouched.
    rewrite ^/v1/(api(?:-vllm|-lens|-tidy|-jobs|-status)?/.*)$ /$1 last;

    # --- Structured JSON errors ---------------------------------------------
    # nginx's own errors are HTML by default, which breaks a JSON client mid-
    # pipeline. Emit the same {"error":{"code",...},"detail"} envelope the
    # services use, so a caller can branch on a stable `code` instead of
    # string-matching prose. Upstream errors are NOT intercepted
    # (proxy_intercept_errors stays off) — the engines already return JSON.
    error_page 429 = @err_rate;
    error_page 413 = @err_large;
    error_page 502 = @err_gateway;
    error_page 504 = @err_timeout;

    location @err_rate {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Retry-After "30" always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Retry after the Retry-After interval.","retry_after":30},"detail":"Rate limit exceeded"}';
    }
    location @err_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 413 '{"error":{"code":"payload_too_large","message":"Upload exceeds 100 MB. Split the document or send one page per request."},"detail":"Payload too large"}';
    }
    location @err_gateway {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 502 '{"error":{"code":"engine_unreachable","message":"The OCR engine could not be reached. Retry once with backoff."},"detail":"Bad gateway"}';
    }
    location @err_timeout {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 504 '{"error":{"code":"engine_timeout","message":"The engine took too long. Send fewer pages per request."},"detail":"Gateway timeout"}';
    }

    # gzip text payloads (assets are already minified but HTML/JSON benefit).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # WITHOUT THIS, none of the API responses are compressed at all: gzip_proxied
    # defaults to `off`, and everything under /api* comes from a proxied backend.
    # It matters most exactly where it hurts — a DocumentResult carries a
    # base64 crop per picture region and runs to megabytes, all of it previously
    # crossing the funnel raw. JSON compresses ~5-10x.
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Cached health probe (exact match, evaluated before /api/) ----------
    # Serves the backend badge instantly instead of waiting out a 16-22s Modal
    # cold start. `background_update` + `use_stale` mean: the first caller may
    # wait, everyone after that gets a cached answer immediately, and the entry
    # is refreshed in the background. If the upstream is waking, erroring, or
    # rate-limiting, the last good answer is served rather than failing the
    # badge -- so the backend reads "ready" whenever it is genuinely usable.
    # Only /health is cached; every real OCR call still goes straight upstream.
    location = /api/health {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Health-Cache $upstream_cache_status always;

        # Health is cheap and polled by the SPA — a much looser limit than /api.
        limit_req zone=health_rl burst=20 nodelay;

        proxy_cache healthcache;
        proxy_cache_key "modal-health";
        proxy_cache_valid 200 120s;
        proxy_cache_lock on;                 # one wake-up request, not a stampede
        proxy_cache_lock_timeout 30s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout invalid_header
                              http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        rewrite ^/api/health$ /health break;
        proxy_pass ${API_UPSTREAM};

        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Same-origin reverse proxy ------------------------------------------
    location /api/ {
        # CORS: the PUBLIC Netlify SPA calls this proxy cross-origin (via the
        # Tailscale Funnel) because Netlify's own proxy caps requests at 26s and
        # real OCR takes longer. nginx has no such cap. Modal is already public,
        # so proxying to it openly adds no new exposure.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        limit_req zone=api_rl burst=40 nodelay;

        # Idempotency-Key replay (no-op unless the caller sends the header).
        proxy_cache idemcache;
        proxy_cache_methods POST;
        proxy_cache_key "$request_method$uri$http_idempotency_key";
        proxy_cache_valid 200 24h;
        proxy_no_cache $idem_skip;
        proxy_cache_bypass $idem_skip;
        # Without this the engines' own cache headers (Cache-Control / Vary /
        # Set-Cookie) stop nginx storing the response and every retry re-runs
        # OCR — the replay silently degrades to a plain second call.
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires Vary;
        add_header X-Idempotency-Replay $upstream_cache_status always;

        # Rewrite /api/<path> to /<path> for the upstream.
        rewrite ^/api/(.*)$ /$1 break;

        # Use the resolver-driven variable form so DNS re-resolution works.
        # (Plain `proxy_pass https://host;` skips the resolver for that host.)
        proxy_pass ${API_UPSTREAM};

        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        # MUST stay on: nginx cannot write a response to cache while streaming
        # it, so `proxy_buffering off` silently disables the Idempotency-Key
        # replay above (every retry re-runs OCR). These responses are JSON
        # documents, not streams, so buffering costs nothing.
        proxy_buffering on;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # If an upstream connection dies mid-request, try the next IP in
        # the pool instead of failing the user.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 60s;
    }

    # --- Local vLLM backend (optional, toggled in the UI) ------------------
    # When the user flips the in-app backend toggle to "vLLM", the SPA calls
    # /api-vllm/* instead of /api/*. We strip the prefix and proxy to the
    # vllm-adapter sidecar BY CONTAINER NAME over the shared Docker network
    # (this container joins surya-container-vllm_default — see docker-compose).
    #
    # Why the container name and not host.docker.internal:8090? The host-port
    # hop relies on Docker Desktop's WSL2 port forwarding, which goes stale
    # (PC sleep, WSL restart, idle) — leaving the adapter "healthy but
    # unreachable" and the UI showing "vLLM offline". Container-to-container
    # over Docker's embedded DNS (127.0.0.11, in the resolver list above) has
    # no such relay, so it stays reachable. The default /api path is unaffected.
    location /api-vllm/ {
        # Resolve the adapter's container name with DOCKER'S DNS ONLY. The global
        # resolver above also lists public DNS (1.1.1.1/8.8.8.8) for the external
        # Modal host; if nginx asked those for the internal name `vllm-adapter`
        # it returns "Host not found" → intermittent 502 every time the 30s DNS
        # cache expires. A location-scoped resolver pinned to 127.0.0.11 (Docker
        # embedded DNS) fixes that while still re-resolving (handles IP changes).
        resolver 127.0.0.11 valid=30s ipv6=off;

        # CORS for the public SPA (same rationale as /api/ above). The adapter
        # token is added server-side below, so the browser never sees it.
        # The adapter (FastAPI) ALSO sends Access-Control-Allow-Origin, so we
        # must HIDE the upstream's copy — two ACAO headers make browsers reject
        # the response as a CORS error ("Surya offline" even though it's up).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        # NOTE: `set` must come BEFORE the `rewrite ... break;` — the break flag
        # ends the rewrite phase, and `set` is a rewrite-phase directive, so a
        # `set` placed after it never runs (leaving $vllm_adapter empty -> 500).
        limit_req zone=api_rl burst=40 nodelay;

        proxy_cache idemcache;
        proxy_cache_methods POST;
        proxy_cache_key "$request_method$uri$http_idempotency_key";
        proxy_cache_valid 200 24h;
        proxy_no_cache $idem_skip;
        proxy_cache_bypass $idem_skip;
        # Without this the engines' own cache headers (Cache-Control / Vary /
        # Set-Cookie) stop nginx storing the response and every retry re-runs
        # OCR — the replay silently degrades to a plain second call.
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires Vary;
        add_header X-Idempotency-Replay $upstream_cache_status always;

        set $vllm_adapter http://vllm-adapter:8090;
        rewrite ^/api-vllm/(.*)$ /$1 break;

        proxy_pass $vllm_adapter;

        proxy_http_version 1.1;

        # Shared secret so the SAME adapter can be safely exposed to the public
        # internet via a Tailscale Funnel (the adapter 401s without it). Injected
        # at image build from the gitignored .env — empty when unset (home-only
        # deployments where the adapter also has no token), which the adapter
        # accepts. Keep the two in sync (both read ADAPTER_TOKEN from .env).
        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        # MUST stay on: nginx cannot write a response to cache while streaming
        # it, so `proxy_buffering off` silently disables the Idempotency-Key
        # replay above (every retry re-runs OCR). These responses are JSON
        # documents, not streams, so buffering costs nothing.
        proxy_buffering on;

        # Model inference is slow; allow long-running requests.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Google Lens backend (optional, toggled in the UI) -----------------
    # When the header backend toggle is set to "Google Lens", the SPA calls
    # /api-lens/* → the lens-adapter sidecar (chrome-lens-py). Same pattern as
    # /api-vllm/ above: Docker-DNS resolver, CORS (with upstream ACAO stripped),
    # and the shared token injected server-side.
    location /api-lens/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        limit_req zone=api_rl burst=40 nodelay;

        proxy_cache idemcache;
        proxy_cache_methods POST;
        proxy_cache_key "$request_method$uri$http_idempotency_key";
        proxy_cache_valid 200 24h;
        proxy_no_cache $idem_skip;
        proxy_cache_bypass $idem_skip;
        # Without this the engines' own cache headers (Cache-Control / Vary /
        # Set-Cookie) stop nginx storing the response and every retry re-runs
        # OCR — the replay silently degrades to a plain second call.
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires Vary;
        add_header X-Idempotency-Replay $upstream_cache_status always;

        set $lens_adapter http://lens-adapter:8091;
        rewrite ^/api-lens/(.*)$ /$1 break;

        proxy_pass $lens_adapter;
        proxy_http_version 1.1;

        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        # MUST stay on: nginx cannot write a response to cache while streaming
        # it, so `proxy_buffering off` silently disables the Idempotency-Key
        # replay above (every retry re-runs OCR). These responses are JSON
        # documents, not streams, so buffering costs nothing.
        proxy_buffering on;

        # Lens round-trips to Google can be slow; allow long requests.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Transform-to-tidy backend (Claude) --------------------------------
    # The Table tab's "Tidy" action POSTs an extracted Markdown table to
    # /api-tidy/tidy → the tidy-adapter sidecar, which calls the Anthropic
    # Messages API to reshape it into tidy data. Same proxy pattern as the
    # vLLM / Lens adapters: Docker-DNS resolver, CORS (upstream ACAO stripped),
    # and the shared token injected server-side.
    location /api-tidy/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        limit_req zone=api_rl burst=40 nodelay;

        proxy_cache idemcache;
        proxy_cache_methods POST;
        proxy_cache_key "$request_method$uri$http_idempotency_key";
        proxy_cache_valid 200 24h;
        proxy_no_cache $idem_skip;
        proxy_cache_bypass $idem_skip;
        # Without this the engines' own cache headers (Cache-Control / Vary /
        # Set-Cookie) stop nginx storing the response and every retry re-runs
        # OCR — the replay silently degrades to a plain second call.
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires Vary;
        add_header X-Idempotency-Replay $upstream_cache_status always;

        set $tidy_adapter http://tidy-adapter:8092;
        rewrite ^/api-tidy/(.*)$ /$1 break;

        proxy_pass $tidy_adapter;
        proxy_http_version 1.1;

        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        # MUST stay on: nginx cannot write a response to cache while streaming
        # it, so `proxy_buffering off` silently disables the Idempotency-Key
        # replay above (every retry re-runs OCR). These responses are JSON
        # documents, not streams, so buffering costs nothing.
        proxy_buffering on;

        # LLM inference can take a while on a large table; allow long requests.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Async batch jobs --------------------------------------------------
    # Submit-and-poll for bulk extraction: POST /v1/api-jobs/jobs returns 202 with
    # a job_id, the service splits the document and OCRs pages in the background,
    # and the caller polls instead of holding a connection open. This is what makes
    # large batches practical without fighting the gateway ceiling.
    location /api-jobs/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        limit_req zone=api_rl burst=40 nodelay;

        # Batch submissions are legitimately larger than a single-page call, and the
        # job service advertises a 200 MB cap (JOBS_MAX_UPLOAD_MB). The server-wide
        # 100M would silently shadow that, so a caller trusting the documented limit
        # would get nginx's 413 at 100 MB. Keep the two numbers in agreement.
        client_max_body_size 200M;

        # Deliberately NO idempotency proxy_cache here: the job service implements
        # Idempotency-Key itself (same key -> same job_id). Caching the 202 at this
        # layer would freeze a job's status snapshot and make polling return stale
        # progress forever.
        set $jobs_adapter http://jobs-adapter:8093;
        rewrite ^/api-jobs/(.*)$ /$1 break;

        proxy_pass $jobs_adapter;
        proxy_http_version 1.1;

        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads can be large, but every response here is fast by design (submit
        # returns 202 immediately; polling is a DB read), so these are generous
        # rather than long.
        proxy_request_buffering on;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- Aggregate status (all engines in one call) ------------------------
    # GET /v1/status answers "which engine should I use?" in one round-trip
    # instead of three /health polls. Served by the status-adapter sidecar,
    # which fans out concurrently and caches for a few seconds.
    #
    # EXACT-match location on purpose: the /v1 rewrite above only matches
    # /v1/api..., so /v1/status would otherwise fall through to the SPA and
    # silently return index.html with a 200 (verified: that is what it does).
    location = /v1/status {
        resolver 127.0.0.11 valid=30s ipv6=off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        # Meant to be polled, so use the cheap health limiter, not api_rl.
        limit_req zone=health_rl burst=20 nodelay;

        set $status_adapter http://status-adapter:8094;
        rewrite ^/v1/status$ /status break;

        proxy_pass $status_adapter;
        proxy_http_version 1.1;

        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must exceed the adapter's own cloud probe budget (22s), or nginx would
        # 504 in the one case where the adapter legitimately blocks on a cold Modal.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # --- Aggregate status, unversioned prefix ------------------------------
    # /api-status/health is the ADAPTER's own liveness (it probes nothing), which
    # is how you tell "the status service broke" from "it is reporting bad news".
    location /api-status/ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        limit_req zone=health_rl burst=20 nodelay;

        set $status_adapter_u http://status-adapter:8094;
        rewrite ^/api-status/(.*)$ /$1 break;

        proxy_pass $status_adapter_u;
        proxy_http_version 1.1;

        proxy_set_header X-Adapter-Token   "${ADAPTER_TOKEN}";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # --- Hashed Vite assets — cache aggressively ---------------------------
    # Note: we deliberately don't include `immutable` here. The URLs are
    # content-hashed so the URL itself changes when the file changes; without
    # immutable, browsers will re-validate via ETag on subsequent visits,
    # which is the safety net we need if the upstream response (e.g.
    # Content-Type) ever changes between deploys.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, must-revalidate";
        try_files $uri =404;
    }

    # --- Static files at the root (favicon, etc.) --------------------------
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --- Default: SPA fallback to index.html -------------------------------
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # --- Defense in depth: don't serve dotfiles (.env, .git, etc.) ---------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
