services:
  metadata-postgres:
    image: postgres:16-alpine
    container_name: metadata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metadata
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:-metadata}
      POSTGRES_DB: metadata
    ports:
      - "${METADATA_DB_PORT:-5433}:5432"
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata -d metadata"]
      interval: 5s
      timeout: 3s
      retries: 10

  metadata-service:
    build: .
    image: metadata-service:latest
    container_name: metadata-service
    restart: unless-stopped
    environment:
      METADATA_DATABASE_URL: postgresql+asyncpg://metadata:${METADATA_DB_PASSWORD:-metadata}@metadata-postgres:5432/metadata
      METADATA_API_KEYS: ${METADATA_API_KEYS:-}
      METADATA_CORS_ORIGINS: ${METADATA_CORS_ORIGINS:-}
      METADATA_ADMIN_USERNAME: ${METADATA_ADMIN_USERNAME:-admin}
      METADATA_ADMIN_PASSWORD: ${METADATA_ADMIN_PASSWORD:-admin}
    ports:
      - "${METADATA_PORT:-8095}:8095"
    networks:
      - default
      - surya
    depends_on:
      metadata-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # Joins the shared surya network so the khmer-parser-ui nginx can reach this
  # service by container name (metadata-service:8095) — same pattern as the
  # adapters. Created by the surya-container-testing vLLM compose.
  surya:
    external: true
    name: surya-container-vllm_default

volumes:
  metadata-db-data:
