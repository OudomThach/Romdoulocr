<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Romdoul OCR — API Reference</title>
  <meta name="description" content="Interactive API reference for Romdoul OCR: Khmer document OCR, layout extraction, tables and translation over plain HTTP." />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    :root { --romdoul: #0891B2; --romdoul-dark: #06748f; --ink: #10161B; }
    body { margin: 0; background: #fafcfd; }

    .rd-bar {
      background: var(--ink);
      color: #fff;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .rd-bar strong { font-size: 15px; letter-spacing: -0.01em; }
    .rd-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--romdoul); flex: none; }
    .rd-bar .sub { color: #8fa3ad; font-size: 12px; }
    .rd-bar a { color: var(--romdoul); text-decoration: none; font-size: 12px; }
    .rd-bar a:hover { text-decoration: underline; }
    .rd-bar .spacer { margin-left: auto; }

    /* Swagger's default green POST bar clashes; align key accents to the brand. */
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 28px 0; }
    .swagger-ui .info .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .swagger-ui .btn.execute { background: var(--romdoul); border-color: var(--romdoul); }
    .swagger-ui .btn.execute:hover { background: var(--romdoul-dark); border-color: var(--romdoul-dark); }
    .swagger-ui .info a { color: var(--romdoul); }
    .swagger-ui .info .title small.version-stamp { background: var(--romdoul); }
    .swagger-ui table thead tr th { border-bottom-color: #d6dee2; }

    /* Wide markdown tables in the description shouldn't blow out the page. */
    .swagger-ui .info .description table { display: block; overflow-x: auto; max-width: 100%; }

    @media (max-width: 640px) {
      .rd-bar { padding: 14px 16px; }
      .rd-bar .sub { display: none; }
    }
  </style>
</head>
<body>
  <div class="rd-bar">
    <span class="dot" aria-hidden="true"></span>
    <strong>Romdoul OCR</strong>
    <span class="sub">Khmer document extraction API</span>
    <span class="spacer"></span>
    <a href="/">← Back to the app</a>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 3,
        displayRequestDuration: true,
        filter: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'BaseLayout'
      });
    };
  </script>
</body>
</html>
